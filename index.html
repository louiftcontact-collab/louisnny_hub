<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louisnny — Bientôt de retour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,200;0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --c1: #0a0a0f;
  --c2: #12121a;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --white: #f0eee8;
  --muted: rgba(240,238,232,0.45);
  --accent: #7DF9FF;
  --accent2: #FF6BF8;
  --accent3: #FFE45E;
}

html, body {
  min-height: 100%;
  background: var(--c1);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── AURORA ── */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.aurora-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  mix-blend-mode: screen;
  opacity: 0;
  animation: aurora-fade 1.2s ease forwards;
}
.a1 {
  width: 60vw; height: 60vw;
  top: -20%; left: -10%;
  background: radial-gradient(circle, #6C3BFF 0%, transparent 70%);
  animation: aurora-fade 1.2s ease 0.1s forwards, drift1 18s ease-in-out 1.3s infinite alternate;
}
.a2 {
  width: 50vw; height: 50vw;
  bottom: -15%; right: -10%;
  background: radial-gradient(circle, #FF3BDA 0%, transparent 70%);
  animation: aurora-fade 1.2s ease 0.3s forwards, drift2 22s ease-in-out 1.5s infinite alternate;
}
.a3 {
  width: 40vw; height: 40vw;
  top: 30%; left: 40%;
  background: radial-gradient(circle, #00D4FF 0%, transparent 70%);
  animation: aurora-fade 1.2s ease 0.5s forwards, drift3 15s ease-in-out 1.7s infinite alternate;
}
@keyframes aurora-fade { to { opacity: 0.18; } }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(5vw, 8vh) scale(1.1); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-8vw, -5vh) scale(1.15); } }
@keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(-4vw, 6vh) scale(0.9); } }

.aurora::after {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.025;
  pointer-events: none;
}

/* ── ORBS ── */
.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  animation: orb-in 2s ease forwards;
}
@keyframes orb-in { to { opacity: 1; } }
.orb1 { width: 3px; height: 3px; background: var(--accent); top: 20%; left: 15%; box-shadow: 0 0 8px var(--accent); animation-delay: 1.5s; }
.orb2 { width: 2px; height: 2px; background: var(--accent2); top: 60%; right: 18%; box-shadow: 0 0 6px var(--accent2); animation-delay: 1.8s; }
.orb3 { width: 3px; height: 3px; background: var(--accent3); bottom: 25%; left: 22%; box-shadow: 0 0 8px var(--accent3); animation-delay: 2s; }

/* ── PAGE ── */
.page {
  position: relative;
  z-index: 10;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.2rem 3rem;
}

.container {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── CARD ── */
.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2.8rem 2rem 2.4rem;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(24px);
  animation: pop-in 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
  opacity: 0.6;
}

.card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent3), transparent);
  opacity: 0.4;
}

@keyframes pop-in {
  to { opacity: 1; transform: translateY(0); }
}

/* ── AVATAR + RING ── */
.avatar-wrap {
  position: relative;
  margin-bottom: 1.8rem;
}
.avatar-ring-outer {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  padding: 2px;
  background: conic-gradient(var(--accent), var(--accent2), var(--accent3), var(--accent));
  animation: spin-ring 4s linear infinite;
}
.avatar-ring-outer::before {
  content: '';
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  background: var(--c1);
}
@keyframes spin-ring { to { transform: rotate(360deg); } }

.avatar {
  position: relative;
  width: 88px; height: 88px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--c2);
  display: flex; align-items: center; justify-content: center;
  z-index: 1;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .fallback {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.8rem;
  letter-spacing: 0.05em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ── NAME ── */
.name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.6rem;
  letter-spacing: 0.08em;
  line-height: 1;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
  margin-bottom: 1.6rem;
}

/* ── EMOJI TRAVAUX ── */
.emoji-row {
  display: flex;
  gap: 0.6rem;
  font-size: 1.5rem;
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: pop-in 0.6s ease 0.9s forwards;
}
.emoji-row span {
  display: inline-block;
  animation: bounce-emoji 1.6s ease-in-out infinite;
}
.emoji-row span:nth-child(1) { animation-delay: 0s; }
.emoji-row span:nth-child(2) { animation-delay: 0.2s; }
.emoji-row span:nth-child(3) { animation-delay: 0.4s; }
.emoji-row span:nth-child(4) { animation-delay: 0.2s; }
.emoji-row span:nth-child(5) { animation-delay: 0s; }

@keyframes bounce-emoji {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ── MESSAGE ── */
.message-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.65rem;
  letter-spacing: 0.1em;
  text-align: center;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--accent3) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.9rem;
  opacity: 0;
  animation: pop-in 0.6s ease 1.05s forwards;
}

.message-sub {
  font-size: 0.8rem;
  font-weight: 300;
  color: var(--muted);
  text-align: center;
  line-height: 1.7;
  letter-spacing: 0.02em;
  max-width: 280px;
  opacity: 0;
  animation: pop-in 0.6s ease 1.2s forwards;
}

/* ── DIVIDER ── */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
  margin: 1.6rem 0;
  opacity: 0;
  animation: pop-in 0.6s ease 1.35s forwards;
}

/* ── PROGRESS BAR ── */
.progress-wrap {
  width: 100%;
  max-width: 240px;
  opacity: 0;
  animation: pop-in 0.6s ease 1.5s forwards;
}
.progress-label {
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(240,238,232,0.25);
  text-align: center;
  margin-bottom: 0.6rem;
}
.progress-track {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  animation: progress-fill 3s cubic-bezier(0.4,0,0.2,1) 1.8s forwards;
}
@keyframes progress-fill {
  0%   { width: 0%; }
  30%  { width: 35%; }
  60%  { width: 58%; }
  80%  { width: 72%; }
  100% { width: 78%; }
}

/* ── FOOTER ── */
.copy {
  margin-top: 2.2rem;
  text-align: center;
  font-size: 0.58rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(240,238,232,0.2);
  opacity: 0;
  animation: pop-in 0.6s ease 1.65s forwards;
}
</style>
</head>
<body>

<div class="aurora">
  <div class="aurora-blob a1"></div>
  <div class="aurora-blob a2"></div>
  <div class="aurora-blob a3"></div>
</div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<main class="page">
  <div class="container">
    <div class="card">

      <div class="avatar-wrap">
        <div class="avatar-ring-outer"></div>
        <div class="avatar">
          <img src="pp.jpg" alt="Louisnny"
            onerror="this.style.display='none';this.nextElementSibling.style.cssText='display:flex;width:100%;height:100%;align-items:center;justify-content:center;';">
          <div class="fallback" style="display:none;">L</div>
        </div>
      </div>

      <div class="name">Louisnny</div>

      <div class="emoji-row">
        <span>🚧</span>
        <span>🔧</span>
        <span>⌚</span>
        <span>🔧</span>
        <span>🚧</span>
      </div>

      <div class="message-title">Site en cours de modification</div>

      <div class="message-sub">
        On retravaille tout ça pour vous offrir<br>
        quelque chose de bien meilleur ✨<br>
        Revenez très bientôt !
      </div>

      <div class="divider"></div>

      <div class="progress-wrap">
        <div class="progress-label">Travaux en cours…</div>
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
      </div>

      <div class="copy">&copy; 2026 Louisnny &mdash; Watches</div>

    </div>
  </div>
</main>

<script>
  const blobs = document.querySelectorAll('.aurora-blob');
  document.addEventListener('mousemove', e => {
    const tx = (e.clientX / window.innerWidth - 0.5) * 30;
    const ty = (e.clientY / window.innerHeight - 0.5) * 30;
    blobs.forEach((b, i) => {
      const f = [1, -1.2, 0.8][i];
      b.style.transform = `translate(${tx*f}px, ${ty*f}px)`;
    });
  });
</script>
</body>
</html>
